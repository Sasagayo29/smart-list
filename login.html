<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart List - Entrar</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: var(--secondary-color);">
    
    <div class="modal-content" style="box-shadow: var(--shadow-lg);">
      <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 2rem;">Smart List</h2>
      
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="input-email" placeholder="seu@email.com" required>
      </div>
      
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="input-senha" placeholder="••••••••" required>
      </div>

      <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem;">
        <button class="btn-primary" id="btn-entrar" style="width: 100%;">Entrar</button>
        <!-- Substitua o botão btn-cadastrar antigo por este: -->
        <button class="btn-cancel" id="btn-ir-cadastro" style="width: 100%; border: none;">Não tem conta? Crie uma</button>
      </div>
      
      <p id="msg-erro" style="color: var(--danger); text-align: center; margin-top: 1rem; font-size: 0.9rem; display: none;"></p>
    </div>

    <script type="module" src="/src/login.js"></script>
  </body>
</html>
