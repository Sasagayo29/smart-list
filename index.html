<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart List - Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="layout-container">
      <!-- Toolbar -->
      <nav class="vertical-toolbar">
        <div class="brand"><h3>SL</h3></div>
        <ul class="nav-links">
          <li class="active">Minhas Listas</li>
          <li id="btn-config">Configurações</li>
        </ul>
        <div class="spacer"></div>
      </nav>

      <main class="main-content">
        <header class="page-header">
          <div class="header-title">
            <h2>Dashboard</h2>
            <p class="subtitle">Gerencie suas compras e orçamentos</p>
          </div>
          <!-- 👇 Botões unificados corretamente aqui 👇 -->
          <div class="header-actions" style="display: flex; gap: 1rem;">
            <button class="btn-cancel" id="btn-baixar-nuvem" title="Puxar dados da nuvem" style="padding: 0.75rem; display: none;">
              <span class="material-symbols-rounded">cloud_download</span>
            </button>
            <button class="btn-primary" id="btn-nova-lista">+ Nova Lista</button>
          </div>
        </header>

        <div class="content-area">
          <div id="listas-container" class="listas-grid"></div>
          <p class="empty-state" id="empty-state" style="display: none;">
            Nenhuma lista encontrada. Crie sua primeira lista de compras!
          </p>
        </div>
      </main>
    </div>

    <!-- Modal de Nova Lista -->
    <div class="modal-overlay" id="modal-lista" style="display: none;">
      <div class="modal-content">
        <h3>Criar Nova Lista</h3>
        
        <div class="form-group">
          <label>Nome da Lista</label>
          <input type="text" id="input-nome-lista" placeholder="Ex: Compras do Mês" required>
        </div>

        <div class="form-group">
          <label>Orçamento Limite (R$)</label>
          <input type="number" id="input-orcamento-lista" placeholder="Ex: 500.00">
        </div>

        <div class="modal-actions">
          <button class="btn-cancel" id="btn-fechar-modal">Cancelar</button>
          <button class="btn-primary" id="btn-salvar-lista">Criar Lista</button>
        </div>
      </div>
    </div>

    <div class="form-group">
          <label>Orçamento Limite (R$)</label>
          <input type="number" id="input-orcamento-lista" placeholder="Ex: 500.00">
        </div>

        <!-- 👇 ADICIONE ESTE BLOCO NOVO 👇 -->
        <div class="form-group">
          <label>Categoria</label>
          <div class="category-selector" id="category-selector">
            <div class="cat-option selected" data-cat="mercado" style="--cat-color: #3b82f6;">
              <span class="material-symbols-rounded">shopping_cart</span>
              <span>Mercado</span>
            </div>
            <div class="cat-option" data-cat="farmacia" style="--cat-color: #ef4444;">
              <span class="material-symbols-rounded">medical_services</span>
              <span>Farmácia</span>
            </div>
            <div class="cat-option" data-cat="construcao" style="--cat-color: #f59e0b;">
              <span class="material-symbols-rounded">handyman</span>
              <span>Construção</span>
            </div>
            <div class="cat-option" data-cat="outros" style="--cat-color: #64748b;">
              <span class="material-symbols-rounded">category</span>
              <span>Outros</span>
            </div>
          </div>
        </div>
        <!-- 👆 FIM DO BLOCO NOVO 👆 -->

        <div class="modal-actions">

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
