<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart List - Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Biblioteca de Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="layout-container">
      <nav class="vertical-toolbar">
        <div class="brand"><h3>SL</h3></div>
        <ul class="nav-links">
          <li class="active"><span class="material-symbols-rounded">home</span></li>
          <li id="btn-config"><span class="material-symbols-rounded">settings</span></li>
        </ul>
        <div class="spacer"></div>
      </nav>

      <main class="main-content">
        <header class="page-header">
          <div class="header-title">
            <h2>Dashboard</h2>
            <p class="subtitle">Gerencie suas compras e orçamentos</p>
          </div>
          <div class="header-actions" style="display: flex; gap: 1rem;">
            <button class="btn-cancel" id="btn-baixar-nuvem" title="Sincronizar" style="padding: 0.75rem; display: none;">
              <span class="material-symbols-rounded">sync</span>
            </button>
            <button class="btn-primary" id="btn-nova-lista">+ Nova Lista</button>
          </div>
        </header>

        <div class="content-area">
          <!-- Gráfico Analítico -->
          <div id="chart-section" style="background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius-lg); margin-bottom: 2rem; border: 1px solid var(--border-color); display: none;">
            <h3 style="margin-bottom: 1rem; font-size: 1.1rem; color: var(--text-muted);">Análise das Últimas Listas</h3>
            <canvas id="grafico-gastos" style="max-height: 220px;"></canvas>
          </div>

          <div id="listas-container" class="listas-grid"></div>
          <p class="empty-state" id="empty-state" style="display: none;">
            Nenhuma lista encontrada. Crie sua primeira lista!
          </p>
        </div>
      </main>
    </div>

    <!-- Modal Nova Lista -->
    <div class="modal-overlay" id="modal-lista" style="display: none;">
      <div class="modal-content">
        <h3>Criar Nova Lista</h3>
        <div class="form-group">
          <label>Nome da Lista</label>
          <input type="text" id="input-nome-lista" placeholder="Ex: Compras do Mês" required>
        </div>
        <div class="form-group">
          <label>Orçamento Limite (R$)</label>
          <input type="number" id="input-orcamento-lista" placeholder="Ex: 500.00">
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <div class="category-selector" id="category-selector">
            <div class="cat-option selected" data-cat="mercado" style="--cat-color: #3b82f6;"><span class="material-symbols-rounded">shopping_cart</span><span>Mercado</span></div>
            <div class="cat-option" data-cat="farmacia" style="--cat-color: #ef4444;"><span class="material-symbols-rounded">medical_services</span><span>Farmácia</span></div>
            <div class="cat-option" data-cat="construcao" style="--cat-color: #f59e0b;"><span class="material-symbols-rounded">handyman</span><span>Construção</span></div>
            <div class="cat-option" data-cat="outros" style="--cat-color: #64748b;"><span class="material-symbols-rounded">category</span><span>Outros</span></div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="btn-fechar-modal">Cancelar</button>
          <button class="btn-primary" id="btn-salvar-lista">Criar Lista</button>
        </div>
      </div>
    </div>
    <div id="toast-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
