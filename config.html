<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart List - Configurações</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="layout-container">
      <nav class="vertical-toolbar">
        <div class="brand"><h3>SL</h3></div>
        <ul class="nav-links">
          <li onclick="window.location.href='/'"><span class="material-symbols-rounded">home</span></li>
          <li class="active"><span class="material-symbols-rounded">settings</span></li>
        </ul>
        <div class="spacer"></div>
      </nav>

      <main class="main-content">
        <header class="page-header" style="justify-content: flex-start; gap: 1rem;">
          <button class="btn-icon" onclick="window.location.href='/'"><span class="material-symbols-rounded">arrow_back</span></button>
          <div class="header-title">
            <h2>Configurações</h2>
          </div>
        </header>

        <div class="content-area" style="max-width: 600px; margin: 0 auto; width: 100%;">
          
          <div class="lista-card" style="margin-bottom: 2rem; display: flex; align-items: center; gap: 1.5rem;">
            <div style="background: var(--primary-color); width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; color: white;">
              <span class="material-symbols-rounded">person</span>
            </div>
            <div>
              <h3 id="user-email" style="margin-bottom: 0.25rem;">Carregando...</h3>
              <p style="color: var(--success); font-size: 0.9rem; font-weight: 600;">Conta Sincronizada</p>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 1rem; width: 100%;">
            
            <button class="btn-cancel" style="width: 100%; display: flex; justify-content: space-between; align-items: center; border-color: var(--border-color); color: var(--text-main); padding: 1rem;">
              <span style="display: flex; align-items: center; gap: 1rem;"><span class="material-symbols-rounded">palette</span> Aparência (Em breve)</span>
              <span class="material-symbols-rounded">chevron_right</span>
            </button>
            
            <button class="btn-cancel" id="btn-limpar-cache" style="width: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 1rem; border-color: var(--border-color); color: var(--text-main); padding: 1rem;">
              <span class="material-symbols-rounded">cleaning_services</span> Limpar Banco Local
            </button>
            
            <button class="btn-primary" id="btn-logout" style="width: 100%; background-color: var(--danger); margin-top: 1rem; padding: 1rem;">
              <span class="material-symbols-rounded">logout</span> Sair da Conta
            </button>
            
          </div>

        </div>
      </main>
    </div>
    <div id="toast-container"></div>
    <script type="module" src="/src/config.js"></script>
  </body>
</html>
