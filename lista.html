<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart List - Itens</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/lista.css" />
  </head>
  <body>
    <div class="layout-container">
      <nav class="vertical-toolbar">
        <div class="brand"><h3>SL</h3></div>
        <ul class="nav-links">
          <li id="btn-voltar-nav">← Voltar</li>
          <li class="active">Itens da Lista</li>
        </ul>
        <div class="spacer"></div>
      </nav>

      <main class="main-content">
        <!-- 🌟 Ilha Dinâmica Unificada 🌟 -->
        <div class="dynamic-island-container">
          <div class="dynamic-island unified-island">
            <button class="island-icon" id="btn-voltar-ilha" title="Voltar">
              <span class="material-symbols-rounded">arrow_back_ios_new</span>
            </button>

            <div class="island-center">
              <span class="island-title" id="nome-lista-ilha">Carregando...</span>
              <span class="island-total" id="total-lista-ilha">R$ 0.00</span>
            </div>

            <div class="island-actions">
              <button class="island-icon primary" id="btn-add-item" title="Adicionar Manual">
                <span class="material-symbols-rounded">add</span>
              </button>
              
              <label class="island-icon primary camera-label" title="Ler Etiqueta">
                <input type="file" accept="image/*" capture="environment" id="input-camera" style="display: none;">
                <span class="material-symbols-rounded">photo_camera</span>
              </label>
              
              <button class="island-icon secondary" id="btn-sincronizar" title="Sincronizar Nuvem">
                <span class="material-symbols-rounded">cloud_upload</span>
              </button>
            </div>
          </div>
        </div>

        <div class="content-area">
          <div class="search-bar" id="search-container" style="display: none;">
            <span class="material-symbols-rounded">search</span>
            <input type="text" id="input-busca" placeholder="Buscar na lista...">
          </div>

          <p class="empty-state" id="empty-state-itens">
            Sua lista está vazia. Adicione um produto manualmente ou escaneie!
          </p>

          <div class="itens-list" id="itens-container"></div>
        </div>
      </main>
    </div>

    <!-- Modal de Novo Produto -->
    <div class="modal-overlay" id="modal-item" style="display: none;">
      <div class="modal-content">
        <h3>Adicionar Produto</h3>
        <div class="form-group">
          <label>Nome do Produto</label>
          <input type="text" id="input-nome-item" placeholder="Ex: Arroz 5kg" required>
        </div>
        <div class="form-row" style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex: 1;">
            <label>Quantidade</label>
            <input type="number" id="input-qtd-item" min="1" value="1">
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Preço Unitário (R$)</label>
            <input type="number" id="input-preco-item" placeholder="0.00" step="0.01">
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="btn-fechar-modal-item">Cancelar</button>
          <button class="btn-primary" id="btn-salvar-item">Salvar</button>
        </div>
      </div>
    </div>

    <!-- ... Botão da Câmera (já existente) ... -->
<label class="island-icon primary camera-label" title="Ler Etiqueta">
  <input type="file" accept="image/*" capture="environment" id="input-camera" style="display: none;">
  <span class="material-symbols-rounded">photo_camera</span>
</label>

<!-- 👇 NOVO: Botão de Importar TXT/Excel 👇 -->
<label class="island-icon secondary" title="Importar Planilha ou Texto">
  <input type="file" accept=".txt, .csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" id="input-importar" style="display: none;">
  <span class="material-symbols-rounded">upload_file</span>
</label>

<!-- ... Botão de Sincronizar Nuvem (já existente) ... -->
    <script type="module" src="/src/lista.js"></script>
  </body>
</html>
