<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart List - Itens</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/lista.css" />
  </head>
  <body>
    <div class="layout-container">
      <nav class="vertical-toolbar">
        <div class="brand"><h3>SL</h3></div>
        <ul class="nav-links">
          <li id="btn-voltar-nav"><span class="material-symbols-rounded">arrow_back</span></li>
          <li class="active"><span class="material-symbols-rounded">list</span></li>
        </ul>
        <div class="spacer"></div>
      </nav>

      <main class="main-content">
        <div class="dynamic-island-container">
          <div class="dynamic-island unified-island">
            <button class="island-icon" id="btn-voltar-ilha"><span class="material-symbols-rounded">arrow_back_ios_new</span></button>
            <div class="island-center">
              <span class="island-title" id="nome-lista-ilha">Carregando...</span>
              <span class="island-total" id="total-lista-ilha">R$ 0.00</span>
            </div>
            <div class="island-actions">
              <button class="island-icon primary" id="btn-add-item"><span class="material-symbols-rounded">add</span></button>
              <!-- Botão do WhatsApp -->
              <button class="island-icon secondary" id="btn-whatsapp" title="Exportar para WhatsApp"><span class="material-symbols-rounded">share</span></button>
              <button class="island-icon secondary" id="btn-sincronizar"><span class="material-symbols-rounded">sync</span></button>
            </div>
          </div>
        </div>

        <div class="content-area">
          <div class="search-bar" id="search-container" style="display: none;">
            <span class="material-symbols-rounded">search</span>
            <input type="text" id="input-busca" placeholder="Buscar na lista...">
          </div>
          <p class="empty-state" id="empty-state-itens">Sua lista está vazia. Adicione um produto!</p>
          <div class="itens-list" id="itens-container"></div>
        </div>
      </main>
    </div>

    <!-- Modais e Calculadora Ocultos -->
    <div class="modal-overlay" id="modal-item" style="display: none;">
      <div class="modal-content">
        <h3>Adicionar Produto</h3>
        <div class="form-group"><label>Nome</label><input type="text" id="input-nome-item" required></div>
        <div class="form-row" style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex: 1;"><label>Quantidade</label><input type="number" id="input-qtd-item" min="1" value="1"></div>
          <div class="form-group" style="flex: 1;"><label>Preço (R$)</label><input type="number" id="input-preco-item"></div>
        </div>
        <div class="modal-actions"><button class="btn-cancel" id="btn-fechar-modal-item">Cancelar</button><button class="btn-primary" id="btn-salvar-item">Salvar</button></div>
      </div>
    </div>

    <button class="fab-calculator" id="btn-open-calc"><span class="material-symbols-rounded">calculate</span></button>
    <div class="modal-overlay" id="modal-calculadora" style="display: none; align-items: flex-end;">
      <div class="calc-container">
        <div class="calc-header">
          <h3 style="color: var(--primary-color);">Calculadora</h3>
          <button class="btn-icon" id="btn-close-calc" style="color: var(--text-muted);"><span class="material-symbols-rounded">close</span></button>
        </div>
        <div class="calc-display" id="calc-display">0</div>
        <div class="calc-grid">
          <button class="calc-btn btn-clear" data-action="clear">C</button>
          <button class="calc-btn btn-op" data-action="delete">⌫</button>
          <button class="calc-btn btn-op" data-action="operator" data-val="/">÷</button>
          <button class="calc-btn btn-op" data-action="operator" data-val="*">×</button>
          <button class="calc-btn" data-action="number" data-val="7">7</button>
          <button class="calc-btn" data-action="number" data-val="8">8</button>
          <button class="calc-btn" data-action="number" data-val="9">9</button>
          <button class="calc-btn btn-op" data-action="operator" data-val="-">-</button>
          <button class="calc-btn" data-action="number" data-val="4">4</button>
          <button class="calc-btn" data-action="number" data-val="5">5</button>
          <button class="calc-btn" data-action="number" data-val="6">6</button>
          <button class="calc-btn btn-op" data-action="operator" data-val="+">+</button>
          <button class="calc-btn" data-action="number" data-val="1">1</button>
          <button class="calc-btn" data-action="number" data-val="2">2</button>
          <button class="calc-btn" data-action="number" data-val="3">3</button>
          <button class="calc-btn btn-equal" data-action="calculate" style="grid-row: span 2;">=</button>
          <button class="calc-btn" data-action="number" data-val="0" style="grid-column: span 2;">0</button>
          <button class="calc-btn" data-action="number" data-val=".">.</button>
        </div>
        <button class="btn-primary" id="btn-usar-valor" style="width: 100%; margin-top: 1.5rem; background-color: var(--success); color: #000;">Usar Valor (R$)</button>
      </div>
    </div>
    
    <div id="toast-container"></div>
    <script type="module" src="/src/lista.js"></script>
  </body>
</html>
